<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle glow ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" />

  <!-- Calendar / Book Base Card -->
  <g filter="url(#shadow)">
    <rect x="96" y="128" width="320" height="280" rx="28" fill="url(#cardGrad)" />
    
    <!-- Top Header Bar on Calendar -->
    <path d="M 96 156 C 96 140.536 108.536 128 124 128 L 388 128 C 403.464 128 416 140.536 416 156 L 416 192 L 96 192 Z" fill="#2563EB" />

    <!-- Binder Rings -->
    <rect x="160" y="104" width="24" height="48" rx="12" fill="#3B82F6" stroke="#FFFFFF" stroke-width="4" />
    <rect x="244" y="104" width="24" height="48" rx="12" fill="#3B82F6" stroke="#FFFFFF" stroke-width="4" />
    <rect x="328" y="104" width="24" height="48" rx="12" fill="#3B82F6" stroke="#FFFFFF" stroke-width="4" />

    <!-- Weekly Grid Lines & Checkmarks -->
    <!-- Row 1 -->
    <rect x="136" y="224" width="160" height="16" rx="8" fill="#94A3B8" />
    <circle cx="360" cy="232" r="14" fill="#10B981" />
    <path d="M 353 232 L 358 237 L 367 227" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Row 2 -->
    <rect x="136" y="272" width="200" height="16" rx="8" fill="#CBD5E1" />
    <circle cx="360" cy="280" r="14" fill="#10B981" />
    <path d="M 353 280 L 358 285 L 367 275" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Row 3 -->
    <rect x="136" y="320" width="130" height="16" rx="8" fill="#E2E8F0" />
    <circle cx="360" cy="328" r="14" fill="#3B82F6" />
    <circle cx="360" cy="328" r="5" fill="#FFFFFF" />

    <!-- Bottom Badge/Star -->
    <path d="M 136 362 H 220" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Sparkle / AI Star Badge at top right -->
  <g transform="translate(380, 80)">
    <circle cx="24" cy="24" r="32" fill="#0D9488" stroke="#FFFFFF" stroke-width="4" />
    <path d="M 24 10 L 28 19 L 38 20 L 30 27 L 33 37 L 24 31 L 15 37 L 18 27 L 10 20 L 20 19 Z" fill="#FFFFFF" />
  </g>
</svg>
